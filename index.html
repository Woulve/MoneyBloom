<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting...</title>
  <script>
    const userLang = navigator.language || navigator.userLanguage;
    const supportedLocales = ['en-US', 'de'];
    
    if (userLang.startsWith('de')) {
      window.location.href = '/de/';
    } else {
      window.location.href = '/en-US/';
    }
  </script>
  <noscript>
    <meta http-equiv="refresh" content="0;url=/en-US/">
  </noscript>
</head>
<body>
  <p>Redirecting to MoneyBloom...</p>
  <p>If you are not redirected automatically, <a href="/en-US/">click here for English</a> or <a href="/de/">hier für Deutsch</a>.</p>
</body>
</html>
