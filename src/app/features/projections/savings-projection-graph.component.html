<div class="relative">
  <div
    echarts
    [options]="chartOptions()"
    (chartInit)="onChartInit($event)"
    class="w-full h-96"
  ></div>

  @if (showPopup() && clickedDate()) {
    <app-adjustment-marker-popup
      [date]="clickedDate()!"
      [existingAdjustment]="editingAdjustment()"
      (close)="onPopupClose()"
      (adjustmentAdded)="onAdjustmentAdded($event)"
      (adjustmentUpdated)="onAdjustmentUpdated($event)"
      (adjustmentDeleted)="onAdjustmentDeleted($event)"
    />
  }

  <div class="mt-4 text-sm text-gray-400">
    <p class="mb-2">Click on the graph to add timeline adjustments</p>
    <div class="flex flex-wrap gap-4">
      <div class="flex items-center gap-2">
        <div class="w-3 h-3 rounded-full bg-amber-500"></div>
        <span>Contribution Change</span>
      </div>
      <div class="flex items-center gap-2">
        <div class="w-3 h-3 rounded-full bg-purple-500"></div>
        <span>Growth Rate Change</span>
      </div>
      <div class="flex items-center gap-2">
        <div class="w-3 h-3 rounded-full bg-green-500"></div>
        <span>One-time Deposit</span>
      </div>
      <div class="flex items-center gap-2">
        <div class="w-3 h-3 rounded-full bg-red-500"></div>
        <span>One-time Withdrawal</span>
      </div>
    </div>
  </div>
</div>
